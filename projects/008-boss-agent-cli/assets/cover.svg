<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">BOSS Agent CLI 招聘工作流与风控边界研究</title><desc id="desc">从登录会话、平台访问到本地业务与可选 AI；离线演示筛选误判和风险停止。</desc>
<rect width="1400" height="820" fill="#f5f5ed"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="64" y="55" width="49" height="49" rx="12" fill="#087667"/><text x="76" y="91" fill="#fff" font-size="33" font-weight="700">b.</text><text x="131" y="77" fill="#183d36" font-size="21" font-weight="700">BOSS Agent CLI</text><text x="131" y="101" fill="#62736b" font-size="13">GITHUB RESEARCH LAB / 008</text><text x="1090" y="84" fill="#62736b" font-size="14">v3.0.0 · 7f46ba3</text>
<text x="66" y="218" fill="#087667" font-size="15" letter-spacing="3">CAPABILITIES / MECHANISM / EVIDENCE</text><text x="62" y="301" fill="#183d36" font-size="60" font-weight="650">把招聘流程，</text><text x="62" y="383" fill="#087667" font-size="60" font-weight="650">变成 Agent 的工具。</text><text x="66" y="442" fill="#62736b" font-size="20">复用登录会话，封装业务流程，按需接入 AI。</text><text x="66" y="480" fill="#62736b" font-size="20">有效凭据不等于平台放行，关键词命中不等于语义符合。</text>
<rect x="828" y="180" width="506" height="337" rx="15" fill="#183d36"/><text x="856" y="216" fill="#b1c9b8" font-size="13">WORKFLOW / 源码原理</text><g font-size="19" fill="#e4ecdd"><rect x="855" y="239" width="452" height="62" rx="6" fill="#2b5145"/><text x="875" y="278">01  登录会话 → Cookie + 页面 Token</text><rect x="855" y="315" width="452" height="62" rx="6" fill="#2b5145"/><text x="875" y="354">02  平台访问 → httpx / 浏览器</text><rect x="855" y="391" width="452" height="62" rx="6" fill="#2b5145"/><text x="875" y="430">03  本地筛选 → 候选池 → 可选 AI</text></g><text x="856" y="491" fill="#bbd3bd" font-size="13">JSON / Schema / MCP / Python API</text>
<path d="M66 558H1334" stroke="#d5ddce"/><g fill="#183d36"><text x="66" y="631" fill="#087667" font-size="43">59</text><text x="143" y="619" font-size="18">项上游离线测试</text><text x="143" y="648" fill="#62736b" font-size="14">过滤 · 评分 · 搜索管线 · 评测器</text><text x="520" y="631" fill="#bd572d" font-size="43">10</text><text x="600" y="619" font-size="18">个语义探针</text><text x="600" y="648" fill="#62736b" font-size="14">专门构造反例，复现否定与同义词局限</text><text x="1010" y="631" fill="#087667" font-size="43">00</text><text x="1090" y="619" font-size="18">次真实平台请求</text><text x="1090" y="648" fill="#62736b" font-size="14">合成岗位，离线交互</text></g><rect x="66" y="710" width="1268" height="51" rx="7" fill="#e7ede1"/><text x="88" y="743" fill="#526d58" font-size="15">研究结论：适合学习工具合同、业务状态与可恢复流程；没有证据证明长期在线稳定性或录用转化提升。</text></g></svg>
