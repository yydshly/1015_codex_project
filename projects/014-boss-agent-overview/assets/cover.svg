<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">BOSS Agent CLI 能力、原理、效果与职业探索目标</title><desc id="desc">已有招聘工具基础，经正常会话和业务处理，呈现岗位清单与 JSON，可进一步扩展职业画像与方向比较。</desc><rect width="1400" height="850" fill="#f4f5ee"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="65" y="55" width="48" height="48" rx="11" fill="#08796c"/><text x="78" y="91" fill="#fff" font-size="33" font-weight="700">b</text><text x="130" y="79" fill="#173e37" font-size="22" font-weight="650">BOSS Agent CLI</text><text x="130" y="103" fill="#60736b" font-size="13">能力总览与职业探索 / 研究 013</text><text x="1085" y="85" fill="#60736b" font-size="15">2026.10.20 · v3.0.0</text><text x="65" y="208" fill="#08796c" font-size="16" letter-spacing="3">从工具能力，到应用目标</text><text x="60" y="290" fill="#173e37" font-size="61" font-weight="650">从招聘操作，</text><text x="60" y="373" fill="#08796c" font-size="61" font-weight="650">到职业探索。</text><text x="65" y="429" fill="#60736b" font-size="21">把职位发现、筛选与管理变成可调用的工具。</text><text x="65" y="467" fill="#60736b" font-size="21">区分已有功能、离线效果与需要新增的分析。</text><rect x="835" y="185" width="500" height="310" rx="14" fill="#173e37"/><text x="861" y="224" fill="#c1d7be" font-size="15">目标 → 能力 → 结果</text><g fill="#e2ebda" font-size="19"><text x="862" y="284">01  会话与访问</text><text x="862" y="352">02  业务与可选 AI 分析</text><text x="862" y="420">03  清单、JSON 与后续任务</text></g><path d="M862 304H1306M862 372H1306" stroke="#456959"/><text x="862" y="468" fill="#b6cdae" font-size="13">Cookie + 页面 Token，不保证服务端放行</text><path d="M65 535H1335" stroke="#d4dece"/><g fill="#173e37"><text x="65" y="590" fill="#08796c" font-size="14">01 / 能力</text><text x="65" y="629" font-size="23" font-weight="650">求职 · 招聘 · Agent</text><text x="65" y="666" fill="#60736b" font-size="15">双角色流程与统一工具接口</text><text x="715" y="590" fill="#08796c" font-size="14">02 / 原理</text><text x="715" y="629" font-size="23" font-weight="650">会话访问 + 本地业务 + 可选模型</text><text x="715" y="666" fill="#60736b" font-size="15">五步查看数据经过哪里与风险边界</text><text x="65" y="726" fill="#08796c" font-size="14">03 / 呈现效果</text><text x="65" y="765" font-size="23" font-weight="650">候选清单 · JSON · 画像原型</text><text x="65" y="802" fill="#60736b" font-size="15">合成岗位，可交互、可核对</text><text x="715" y="726" fill="#08796c" font-size="14">04 / 可实现目标</text><text x="715" y="765" font-size="23" font-weight="650">画像 · 方向比较 · 差距 · 变化观察</text><text x="715" y="802" fill="#60736b" font-size="15">逐项说明可复用的基础和需要补齐的模块</text></g></g></svg>
