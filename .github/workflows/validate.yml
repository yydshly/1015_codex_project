name: Validate research catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check project registry and README
        run: python scripts/projects.py check
      - name: Test catalog tooling
        run: python -m unittest discover -s tests -v
